services:
  melodi-launcher:
    build: .
    restart: unless-stopped
    environment:
      MELODI_HOST: 0.0.0.0
      MELODI_PORT: 8080
    ports:
      - "${MELODI_HTTP_HOST:-127.0.0.1}:${MELODI_HTTP_PORT:-8080}:8080"
    volumes:
      - melodi-config:/app/config
      - melodi-logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/status', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  melodi-config:
  melodi-logs:
